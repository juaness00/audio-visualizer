<!doctype html>
<html lang="en">
  <head>

    <title>Microphone access · Audio Visualizer</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;

        color: #e8e8ea;
        font:
          15px/1.5 system-ui,
          -apple-system,
          sans-serif;

        max-width: 36ch;

    <script type="module" src="./main.ts"></script>
