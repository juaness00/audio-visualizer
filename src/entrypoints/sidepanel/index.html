<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Visualizer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="panel">
      <canvas id="stage" aria-label="Audio visualization"></canvas>

      <!-- One .state per PanelState view (state.ts); views.ts shows at most one. -->
      <section id="empty" class="state">
        <p>Pick an audio source</p>
        <div class="sources">
          <button id="src-tab" type="button">This tab</button>
          <button id="src-mic" type="button">Microphone</button>
          <label class="button" for="src-file">Audio file</label>
          <input id="src-file" type="file" accept="audio/*" hidden />
        </div>
        <p id="status" class="status" role="status"></p>
      </section>

      <section id="loading" class="state" aria-busy="true" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p id="loading-text" role="status"></p>
      </section>

      <section id="error" class="state" role="alert" hidden>
        <p id="error-title" class="title"></p>
        <p id="error-body" class="status"></p>
        <div class="sources">
          <button id="error-action" type="button"></button>
          <button id="error-back" type="button">Back to sources</button>
        </div>
      </section>

      <!-- Non-blocking: the source keeps running and the banner clears on sound. -->
      <p id="silent" class="banner" role="status" hidden>This tab isn't playing anything.</p>

      <!-- Controls rail. Filled by LOS-14/25/26/27; shown while a source is live. -->
      <footer id="controls" class="rail" aria-label="Controls" hidden></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
